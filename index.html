<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <meta
      name="description"
      content="Crusor is a mobile-first collect-and-dodge arcade game prototype."
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Crusor</title>
  </head>
  <body>
    <main id="app" aria-label="Crusor mobile game">
      <canvas id="game-canvas"></canvas>
      <section class="hud" aria-live="polite">
        <div>
          <span class="label">Score</span>
          <strong id="score">0</strong>
        </div>
        <div>
          <span class="label">Best</span>
          <strong id="best-score">0</strong>
        </div>
        <div>
          <span class="label">Shields</span>
          <strong id="shields">3</strong>
        </div>
      </section>
      <section id="message" class="message">
        <p class="eyebrow">Crusor</p>
        <h1>Catch stars. Dodge meteors.</h1>
        <p>Drag anywhere to steer your ship. Tap start when you are ready.</p>
        <button id="start-button" type="button">Start Game</button>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
